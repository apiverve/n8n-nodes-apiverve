name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: n8n-workflow pulls in isolated-vm, which needs node >=22 and
          # fails to compile otherwise. This only shows up in CI — local node is newer.
          node-version: '22'
      - run: npm install
      - run: npm run lint
      - run: npm run build
